name: safelink-farm

# Farm view safelink di GitHub Actions.
#
# KENAPA ACTIONS: runner GitHub egress-nya TERBUKA — BrightData :44445/:22225,
# scrapeops :8181, smartproxy :7000, oxylabs :7777 semuanya OK. (UpCloud trial
# diblok: cuma TCP 80/443 ke host populer, UDP ditutup total.)
#
# CATATAN JUJUR:
#  * 1 job = 1 IP Azure (mis. 20.228.220.117 / AS8075). Rotasi IP terjadi per JOB,
#    BUKAN per view. Proxy eksternal (BrightData) tetap dipakai; IP Azure cuma
#    jalur keluar, exit IP tetap dari pool.
#  * Cron GitHub itu BEST-EFFORT: `*/5` terukur TIDAK andal (tick 19:00/19:05/19:10
#    nol run). `*/15` jauh lebih andal. Karena itu satu fire = BANYAK view lewat
#    matrix, supaya throughput tidak bergantung pada ketepatan scheduler.
#  * Jangan `| tail` di langkah view: hasil akhir (ok=/final=) kepotong.

on:
  workflow_dispatch:
    inputs:
      link:
        description: "URL safelink (kosongkan = ambil dari links.txt sesuai shard)"
        required: false
      views:
        description: "jumlah view per job (kosongkan = default 1)"
        required: false
        default: "1"
  schedule:
    - cron: "*/15 * * * *"   # 4x/jam — jauh lebih andal dari */5

jobs:
  view:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]        # 4 runner paralel = 4 view per fire
    steps:
      - uses: actions/checkout@v4

      - name: setup python + browser + Xvfb
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y xvfb x11-utils
          python3 -m pip -q install --upgrade pip
          python3 -m pip -q install playwright requests maxminddb
          python3 -m playwright install --with-deps chromium
          Xvfb :99 -screen 0 1920x1080x24 -ac -nolisten tcp -noreset &
          sleep 3
          xdpyinfo -display :99 >/dev/null && echo "Xvfb :99 siap"

      - name: ambil paket safelink-bot
        run: |
          tar xzf safelink-bot.tar.gz
          ls safelink-bot | head -5

      - name: tulis kredensial proxy dari secret
        env:
          PROXIES_B64: ${{ secrets.PROXIES_B64 }}
        run: |
          mkdir -p safelink-bot
          printf '%s' "$PROXIES_B64" | base64 -d > safelink-bot/proxies.txt
          echo "proxies.txt: $(wc -l < safelink-bot/proxies.txt) baris (isi TIDAK di-print)"

      - name: view (shard ${{ matrix.shard }})
        working-directory: safelink-bot
        env:
          DISPLAY: ":99"
        run: |
          LINK="${{ github.event.inputs.link }}"
          if [ -z "$LINK" ]; then
            N=$(wc -l < links.txt)
            IDX=$(( ( ${{ matrix.shard }} - 1 ) % N + 1 ))
            LINK=$(sed -n "${IDX}p" links.txt)
          fi
          echo "shard ${{ matrix.shard }} | target: $LINK"
          timeout 900 python3 bypass_engine.py "$LINK" > /tmp/view.log 2>&1
          echo "EXIT=$?"
          echo "==== HASIL shard ${{ matrix.shard }} ===="
          grep -aE "destination resolved|\"final\"|\"ok\"|\"clicks\"|attempt [0-9]+/" /tmp/view.log | tail -8

      - name: ringkas ke job summary
        if: always()
        run: |
          {
            echo "### shard ${{ matrix.shard }}"
            grep -aE "destination resolved|\"final\"" /tmp/view.log | tail -3 || echo "tidak ada hasil"
          } >> $GITHUB_STEP_SUMMARY
