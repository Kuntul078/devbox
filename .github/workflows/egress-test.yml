name: egress-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: spesifikasi runner
        run: |
          echo "=== CPU/RAM/DISK ==="
          nproc; free -m | head -2; df -h / | tail -1; uname -m; cat /etc/os-release | head -2
          echo "=== egress IP + lokasi ==="
          curl -s -m 15 https://api.ipify.org; echo
          curl -s -m 15 https://ipinfo.io/json | head -c 400; echo
      - name: reachability host proxy
        run: |
          python3 - <<'PY'
          import socket
          targets = [("brd.superproxy.io",44445),("brd.superproxy.io",443),("brd.superproxy.io",22225),
                     ("zproxy.lum-superproxy.io",22225),("residential-proxy.scrapeops.io",8181),
                     ("proxy.scrapeops.io",5353),("p.webshare.io",80),("gate.smartproxy.com",7000),
                     ("pr.oxylabs.io",7777),("geo.iproyal.com",12321),
                     ("sfl.gl",443),("app.khaddavi.net",443),("mediafire.com",443),("sfile.co",443)]
          for h,p in targets:
              try:
                  s=socket.create_connection((h,p),timeout=8); s.close(); print(f"OK    {h}:{p}")
              except Exception as e: print(f"BLOCK {h}:{p}  {type(e).__name__}")
          PY
      - name: proxy pool lokal (3129) + tor
        run: |
          python3 - <<'PY'
          import socket
          for h,p in [("104.207.38.64",3129),("127.0.0.1",9050)]:
              try:
                  s=socket.create_connection((h,p),timeout=6); s.close(); print(f"OK    {h}:{p}")
              except Exception as e: print(f"BLOCK {h}:{p}  {type(e).__name__}")
          PY
